  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);text-align:center;z-index:10;padding:20px}

  #overlay p{margin:6px;font-size:16px;opacity:.9;max-width:640px;line-height:1.5}
  #overlay .keys{margin:20px 0;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:700px}
  #overlay .keys div{background:rgba(255,255,255,.08);padding:8px 14px;border-radius:8px;font-size:13px}
  #overlay .keys kbd{background:#333;padding:2px 8px;border-radius:4px;font-weight:bold;color:#ffcc00;margin:0 1px}
  #overlay button{margin-top:22px;padding:15px 44px;font-size:18px;border:0;border-radius:10px;background:linear-gradient(180deg,#ffcc00,#f39c12);color:#111;cursor:pointer;font-weight:bold;letter-spacing:1px;box-shadow:0 4px 20px rgba(255,204,0,.4)}
  #overlay button:hover{filter:brightness(1.1)}
  #msg{position:fixed;top:20%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:bold;color:#ffcc00;text-shadow:0 0 20px #000,0 0 8px #ffcc00;pointer-events:none;opacity:0;transition:opacity .3s;z-index:6;text-align:center}
  #crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;pointer-events:none;z-index:4;opacity:0;transition:opacity .2s}

  #crosshair .ch-bottom{bottom:0;left:50%;width:2px;height:12px;transform:translateX(-50%)}

  #hitmarker{position:fixed;top:50%;left:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none;z-index:4;opacity:0}
  #hitmarker.show{opacity:1}
  #hitmarker::before,#hitmarker::after{content:'';position:absolute;background:#ff3333;box-shadow:0 0 4px #000}
  #hitmarker::before{top:50%;left:0;width:100%;height:2px;transform:translateY(-50%) rotate(45deg)}
  #hitmarker::after{top:0;left:50%;width:2px;height:100%;transform:translateX(-50%) rotate(45deg)}

<script type="module">
import * as THREE from 'three';

// ============ CONFIG ============
const WORLD_SIZE = 200;
const PLAYER_SPEED = 8;
const PLAYER_RADIUS = 0.45;
const DT_CAP = 0.05;
const BOSS_WAVES = [3, 6, 9, 12];
const BEAR_WAVES = [2, 4, 7, 10];

const WEAPONS = {
  pistol:  { name:'Pistola',  cooldown:0.22, pellets:1, spread:0.008, damage:18, maxAmmo:Infinity, range:80 },
  shotgun: { name:'Escopeta', cooldown:0.60, pellets:7, spread:0.10,  damage:9,  maxAmmo:24,       range:25 },
  rifle:   { name:'Rifle',    cooldown:0.09, pellets:1, spread:0.020, damage:11, maxAmmo:100,      range:120 }
};

// ============ AUDIO ============
let audioCtx = null;
function ensureAudio(){ if(!audioCtx){ try{audioCtx = new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } }
function beep(f,d,type='square',v=0.05,slide=null){
  if(!audioCtx) return;
  try{
    const t=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide), t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
const SFX = {
  shoot:()=>beep(900,0.06,'square',0.05,200),
  shotgun:()=>beep(300,0.12,'sawtooth',0.07,100),
  rifle:()=>beep(1200,0.04,'square',0.04,400),
  enemyShoot:()=>beep(240,0.08,'sawtooth',0.04,100),
  hit:()=>beep(180,0.05,'square',0.05),
  death:()=>beep(400,0.18,'sawtooth',0.06,80),
  pickup:()=>{beep(660,0.08,'sine',0.06);setTimeout(()=>beep(990,0.1,'sine',0.05),60);},
  health:()=>{beep(440,0.12,'sine',0.07);setTimeout(()=>beep(880,0.15,'sine',0.06),100);},
  hostage:()=>{beep(523,0.1,'sine',0.07);setTimeout(()=>beep(784,0.1,'sine',0.07),100);setTimeout(()=>beep(1047,0.2,'sine',0.07),200);},
  boss:()=>beep(80,0.5,'sawtooth',0.09,40),
  bossDie:()=>{beep(150,0.3,'sawtooth',0.09,60);setTimeout(()=>beep(100,0.5,'sawtooth',0.09,40),200);},
  bear:()=>beep(120,0.4,'sawtooth',0.08,50),
  gameover:()=>beep(200,0.8,'sawtooth',0.09,50)
};
document.addEventListener('click', ensureAudio, {once:true});
document.addEventListener('keydown', ensureAudio, {once:true});

// ============ THREE SETUP ============
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 40, 140);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 300);

const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff3c4, 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 150;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(sun.target);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============ TEXTURES ============
function makeGrassTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#3d6b28'; x.fillRect(0,0,256,256);
  for(let i=0;i<4000;i++){
    const px=Math.random()*256, py=Math.random()*256, g=50+Math.random()*70;
    x.fillStyle = `rgb(${20+Math.random()*25},${g},${15+Math.random()*25})`;
    x.fillRect(px,py,1.5,1.5);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(30,30);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function makeWoodTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#8B6B47'; x.fillRect(0,0,128,128);
  for(let i=0;i<20;i++){
    x.strokeStyle = `rgba(50,25,10,${0.1+Math.random()*0.2})`;
    x.lineWidth = 1+Math.random();
    x.beginPath(); x.moveTo(0, Math.random()*128); x.lineTo(128, Math.random()*128); x.stroke();
  }
  for(let i=0;i<10;i++){
    x.fillStyle = 'rgba(0,0,0,0.15)';
    x.fillRect(Math.random()*128, 0, 1.5, 128);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2,2);
  return t;
}
function makeBarkTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#4a2e1a'; x.fillRect(0,0,64,64);
  for(let i=0;i<20;i++){
    x.strokeStyle = `rgba(30,15,5,${0.2+Math.random()*0.3})`;
    x.lineWidth = 1+Math.random()*1.5;
    x.beginPath();
    const px = Math.random()*64;
    x.moveTo(px, 0); x.lineTo(px + (Math.random()-0.5)*8, 64);
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// ============ GROUND ============
const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
const groundMat = new THREE.MeshLambertMaterial({ map: makeGrassTexture() });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const BOUND = WORLD_SIZE/2;
const boundaryMat = new THREE.MeshLambertMaterial({ color: 0x2a3d1e, transparent:true, opacity:0.0 });
const boundaryBoxes = [];
function addBoundary(x,z,w,d){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,5,d), boundaryMat);
  m.position.set(x,2.5,z);
  scene.add(m);
  boundaryBoxes.push(new THREE.Box3().setFromObject(m));
}
addBoundary(0, -BOUND, WORLD_SIZE, 2);
addBoundary(0,  BOUND, WORLD_SIZE, 2);
addBoundary(-BOUND, 0, 2, WORLD_SIZE);
addBoundary( BOUND, 0, 2, WORLD_SIZE);

// ============ COLLECTIONS ============
const wallMeshes = [];
const wallBoxes = [];
const buildings = [];
const hostageObjects = [];
const treeData = [];

function addWallMesh(x, y, z, w, h, d, mat){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  wallMeshes.push(m);
  wallBoxes.push(new THREE.Box3().setFromObject(m));
  return m;
}

const woodMat = new THREE.MeshLambertMaterial({ map: makeWoodTexture() });
const barkMat = new THREE.MeshLambertMaterial({ map: makeBarkTexture() });
const concreteMat = new THREE.MeshLambertMaterial({ color: 0x6b6b6b });
const roofMat = new THREE.MeshLambertMaterial({ color: 0x3a1e14 });
const leafMats = [
  new THREE.MeshLambertMaterial({ color: 0x2d5016 }),
  new THREE.MeshLambertMaterial({ color: 0x3a6b1f }),
  new THREE.MeshLambertMaterial({ color: 0x1f3a10 }),
  new THREE.MeshLambertMaterial({ color: 0x4a7a2a })
];

// ============ TREES ============
function createTreeMesh(){
  const group = new THREE.Group();
  const trunkH = 2.5 + Math.random()*1.5;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.3, trunkH, 7),
    barkMat
  );
  trunk.position.y = trunkH/2;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  group.add(trunk);

  const numLeaves = 4 + Math.floor(Math.random()*3);
  for (let i = 0; i < numLeaves; i++){
    const r = 1.1 + Math.random()*0.8;
    const leaf = new THREE.Mesh(
      new THREE.SphereGeometry(r, 7, 5),
      leafMats[Math.floor(Math.random()*leafMats.length)]
    );
    leaf.position.set(
      (Math.random()-0.5) * 1.4,
      trunkH + (Math.random() - 0.2) * 1.4,
      (Math.random()-0.5) * 1.4
    );
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    group.add(leaf);
  }
  return group;
}
function addTree(x, z){
  const tree = createTreeMesh();
  tree.position.set(x, 0, z);
  tree.rotation.y = Math.random() * Math.PI * 2;
  scene.add(tree);

  const trunkBox = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 3, 0.7),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  trunkBox.position.set(x, 1.5, z);
  scene.add(trunkBox);
  wallMeshes.push(trunkBox);
  wallBoxes.push(new THREE.Box3().setFromObject(trunkBox));
  treeData.push({ x, z, mesh: tree, box: trunkBox });
}

// ============ GRASS WITH WIND ============
let grassMaterial = null;
let grassMesh = null;
function createGrassField(count){
  const geo = new THREE.PlaneGeometry(0.12, 1.1);
  geo.translate(0, 0.55, 0);

  grassMaterial = new THREE.MeshLambertMaterial({
    color: 0x4a7a2a,
    side: THREE.DoubleSide
  });

  grassMaterial.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = { value: 0 };
    shader.vertexShader = shader.vertexShader.replace(
      '#include <common>',
      `#include <common>
       uniform float uTime;
       varying float vGrassY;`
    ).replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       vGrassY = position.y;
       float worldX = instanceMatrix[3].x;
       float worldZ = instanceMatrix[3].z;
       float wind = sin(uTime * 1.4 + worldX * 0.35 + worldZ * 0.25) * 0.18;
       wind += sin(uTime * 2.6 + worldX * 0.6) * 0.07;
       float hN = clamp(position.y, 0.0, 1.1) / 1.1;
       transformed.x += wind * hN * hN;
       transformed.z += wind * 0.4 * hN * hN;
      `
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <common>',
      `#include <common>
       varying float vGrassY;`
    ).replace(
      '#include <color_fragment>',
      `#include <color_fragment>
       float hMix = clamp(vGrassY / 1.1, 0.0, 1.0);
       vec3 baseC = vec3(0.12, 0.28, 0.07);
       vec3 tipC = vec3(0.5, 0.75, 0.22);
       diffuseColor.rgb = mix(baseC, tipC, pow(hMix, 0.7));`
    );
    grassMaterial.userData.shader = shader;
  };

  grassMesh = new THREE.InstancedMesh(geo, grassMaterial, count);
  grassMesh.castShadow = false;
  grassMesh.receiveShadow = false;
  const dummy = new THREE.Object3D();

  for (let i = 0; i < count; i++){
    let x, z, tries = 0;
    do {
      x = (Math.random() - 0.5) * (WORLD_SIZE - 8);
      z = (Math.random() - 0.5) * (WORLD_SIZE - 8);
      tries++;
    } while (tries < 5 && checkCollision(x, z, 0.5));
    dummy.position.set(x, 0, z);
    dummy.rotation.y = Math.random() * Math.PI;
    dummy.scale.set(0.7 + Math.random()*0.6, 0.7 + Math.random()*0.6, 1);
    dummy.updateMatrix();
    grassMesh.setMatrixAt(i, dummy.matrix);
  }
  grassMesh.instanceMatrix.needsUpdate = true;
  scene.add(grassMesh);
}

// ============ HUMAN MODELS ============
function createHumanoid(shirtColor, skinColor = 0xf0c090, scale = 1){
  const g = new THREE.Group();
  const shirt = new THREE.MeshLambertMaterial({ color: shirtColor });
  const skin = new THREE.MeshLambertMaterial({ color: skinColor });
  const dark = new THREE.MeshLambertMaterial({ color: 0x223344 });
  const boot = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const hair = new THREE.MeshLambertMaterial({ color: 0x2a1a0a });
  const belt = new THREE.MeshLambertMaterial({ color: 0x3a2010 });

  // Head (proporción real: ~1/7.5 altura total)
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.11*scale, 16, 12), skin);
  head.scale.set(1, 1.15, 1);
  head.position.y = 1.7*scale;
  head.castShadow = true; g.add(head);

  // Pelo
  const hairMesh = new THREE.Mesh(new THREE.SphereGeometry(0.115*scale, 14, 10, 0, Math.PI*2, 0, Math.PI*0.55), hair);
  hairMesh.position.y = 1.72*scale;
  hairMesh.castShadow = true; g.add(hairMesh);

  // Ojos con pupila
  const eyeWhite = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const eyePupil = new THREE.MeshBasicMaterial({ color: 0x000000 });
  for (const sx of [-1, 1]){
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.028*scale, 8, 6), eyeWhite);
    w.position.set(0.038*sx*scale, 1.72*scale, -0.09*scale);
    g.add(w);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.014*scale, 6, 6), eyePupil);
    p.position.set(0.038*sx*scale, 1.72*scale, -0.115*scale);
    g.add(p);
  }

  // Nariz
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.022*scale, 0.04*scale, 5), skin);
  nose.rotation.x = Math.PI/2;
  nose.position.set(0, 1.68*scale, -0.11*scale);
  g.add(nose);

  // Cuello
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.05*scale, 0.06*scale, 0.08*scale, 8), skin);
  neck.position.y = 1.58*scale; neck.castShadow = true; g.add(neck);

  // Torso (proporciones humanas)
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42*scale, 0.55*scale, 0.24*scale), shirt);
  torso.position.y = 1.25*scale; torso.castShadow = true; g.add(torso);

  // Cinturón
  const beltMesh = new THREE.Mesh(new THREE.BoxGeometry(0.44*scale, 0.06*scale, 0.26*scale), belt);
  beltMesh.position.y = 0.96*scale; beltMesh.castShadow = true; g.add(beltMesh);

  // Caderas
  const hips = new THREE.Mesh(new THREE.BoxGeometry(0.4*scale, 0.16*scale, 0.24*scale), dark);
  hips.position.y = 0.86*scale; hips.castShadow = true; g.add(hips);

  // Brazos (2 segmentos cada uno)
  for (const sx of [-1, 1]){
    const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.055*scale, 0.28*scale, 3, 8), shirt);
    upper.position.set(sx*0.26*scale, 1.32*scale, 0);
    upper.rotation.z = sx * 0.08;
    upper.castShadow = true; g.add(upper);

    const fore = new THREE.Mesh(new THREE.CapsuleGeometry(0.05*scale, 0.26*scale, 3, 8), skin);
    fore.position.set(sx*0.28*scale, 0.95*scale, -0.02*scale);
    fore.castShadow = true; g.add(fore);

    const hand = new THREE.Mesh(new THREE.BoxGeometry(0.08*scale, 0.09*scale, 0.08*scale), skin);
    hand.position.set(sx*0.28*scale, 0.72*scale, -0.03*scale);
    hand.castShadow = true; g.add(hand);
  }

  // Piernas
  for (const sx of [-1, 1]){
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.075*scale, 0.42*scale, 3, 8), dark);
    leg.position.set(sx*0.11*scale, 0.5*scale, 0);
    leg.castShadow = true; g.add(leg);

    const bootMesh = new THREE.Mesh(new THREE.BoxGeometry(0.13*scale, 0.1*scale, 0.22*scale), boot);
    bootMesh.position.set(sx*0.11*scale, 0.08*scale, -0.04*scale);
    bootMesh.castShadow = true; g.add(bootMesh);
  }
  return g;
}

function createMarker(text, color){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.font = 'bold 96px system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.strokeStyle = '#000'; x.lineWidth = 10; x.strokeText(text, 64, 64);
  x.fillStyle = '#'+color.toString(16).padStart(6,'0'); x.fillText(text, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
  return new THREE.Sprite(mat);
}

// ============ COLLISION ============
function checkCollision(x, z, radius){
  for (const box of wallBoxes){
    const cx = Math.max(box.min.x, Math.min(x, box.max.x));
    const cz = Math.max(box.min.z, Math.min(z, box.max.z));
    const dx = x - cx, dz = z - cz;
    if (dx*dx + dz*dz < radius*radius) return true;
  }
  for (const box of boundaryBoxes){
    const cx = Math.max(box.min.x, Math.min(x, box.max.x));
    const cz = Math.max(box.min.z, Math.min(z, box.max.z));
    const dx = x - cx, dz = z - cz;
    if (dx*dx + dz*dz < radius*radius) return true;
  }
  return false;
}

// ============ VISION ============
function enemySeesPlayer(e){
  const px = player.position.x, pz = player.position.z;
  const ex = e.mesh.position.x, ez = e.mesh.position.z;
  const dx = px - ex, dz = pz - ez;
  const distSq = dx*dx + dz*dz;
  if (distSq > e.visionRange*e.visionRange) return false;
  const facingX = -Math.sin(e.mesh.rotation.y);
  const facingZ = -Math.cos(e.mesh.rotation.y);
  const dist = Math.sqrt(distSq);
  const dot = (dx/dist)*facingX + (dz/dist)*facingZ;
  if (dot < Math.cos(e.visionAngle/2)) return false;
  const origin = new THREE.Vector3(ex, 1.5, ez);
  const dir = new THREE.Vector3(dx/dist, 0, dz/dist);
  const ray = new THREE.Raycaster(origin, dir, 0, dist);
  const hits = ray.intersectObjects(wallMeshes, false);
  return hits.length === 0;
}

function generateWorld(){
  for (const m of wallMeshes) scene.remove(m);
  for (const t of treeData) scene.remove(t.mesh);
  wallMeshes.length = 0; wallBoxes.length = 0;
  buildings.length = 0; hostageObjects.length = 0;
  treeData.length = 0;

  // Edificios
  for (let i = 0; i < 6; i++){
    for (let t = 0; t < 30; t++){
      const bw = 12 + Math.random()*8;
      const bd = 12 + Math.random()*8;
      const bx = -BOUND + 10 + Math.random()*(WORLD_SIZE - 20 - bw);
      const bz = -BOUND + 10 + Math.random()*(WORLD_SIZE - 20 - bd);
      if (bx + bw > -10 && bx < 10 && bz + bd > -10 && bz < 10) continue;
      let ok = true;
      for (const b of buildings){
        if (bx < b.x + b.w + 5 && bx + bw + 5 > b.x && bz < b.z + b.d + 5 && bz + bd + 5 > b.z){ ok = false; break; }
      }
      if (!ok) continue;

      const wallH = 4, wallT = 0.5;
      const cx = bx + bw/2, cz = bz + bd/2;
      const doorW = 3;
      addWallMesh(cx, wallH/2, bz, bw, wallH, wallT, woodMat);
      addWallMesh(bx + (bw - doorW)/4, wallH/2, bz + bd, (bw - doorW)/2, wallH, wallT, woodMat);
      addWallMesh(bx + bw - (bw - doorW)/4, wallH/2, bz + bd, (bw - doorW)/2, wallH, wallT, woodMat);
      addWallMesh(bx + bw, wallH/2, cz, wallT, wallH, bd, woodMat);
      addWallMesh(bx, wallH/2, cz, wallT, wallH, bd, woodMat);

      const roof = new THREE.Mesh(new THREE.BoxGeometry(bw + 0.6, 0.3, bd + 0.6), roofMat);
      roof.position.set(cx, wallH + 0.15, cz);
      roof.castShadow = true;
      scene.add(roof);

      const building = { x:bx, z:bz, w:bw, d:bd, door:{ x:cx, z:bz+bd, w:doorW } };
      if (Math.random() < 0.7){
        const hx = bx + 2 + Math.random()*(bw - 4);
        const hz = bz + 2 + Math.random()*(bd - 4);
        const h = createHumanoid(0xf39c12, 0xe6a23c, 1);
        h.position.set(hx, 0, hz);
        scene.add(h);
        const marker = createMarker('!', 0xffcc00);
        marker.position.set(hx, 2.6, hz);
        scene.add(marker);
        const hostage = { x:hx, z:hz, mesh:h, marker, freed:false, building };
        building.hostage = hostage;
        hostageObjects.push(hostage);
      }
      buildings.push(building);
      break;
    }
  }

  // Cajas
  for (let i = 0; i < 20; i++){
    for (let t = 0; t < 20; t++){
      const w = 2 + Math.random()*3;
      const h = 2 + Math.random()*3;
      const d = 2 + Math.random()*3;
      const x = -BOUND + 5 + Math.random()*(WORLD_SIZE - 10 - w);
      const z = -BOUND + 5 + Math.random()*(WORLD_SIZE - 10 - d);
      if (x > -12 && x < 12 && z > -12 && z < 12) continue;
      let ok = true;
      for (const b of buildings){
        if (x < b.x + b.w + 3 && x + w + 3 > b.x && z < b.z + b.d + 3 && z + d + 3 > b.z){ ok = false; break; }
      }
      if (!ok) continue;
      addWallMesh(x + w/2, h/2, z + d/2, w, h, d, concreteMat);
      break;
    }
  }

  // Árboles
  for (let i = 0; i < 30; i++){
    for (let t = 0; t < 30; t++){
      const x = -BOUND + 5 + Math.random()*(WORLD_SIZE - 10);
      const z = -BOUND + 5 + Math.random()*(WORLD_SIZE - 10);
      if (x > -15 && x < 15 && z > -15 && z < 15) continue;
      if (checkCollision(x, z, 2)) continue;
      addTree(x, z);
      break;
    }
  }
}

// ============ SHOOTING ============
let muzzleLight = null;
function shootOnce(){
  const w = WEAPONS[player.weapon];

  // Dirección de la cámara = donde apunta la mira
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const camOrigin = camera.position.clone();
  const camRay = new THREE.Raycaster(camOrigin, camDir, 0.1, 200);
  const camTargets = wallMeshes.concat(enemies.map(e => e.mesh));
  const camHits = camRay.intersectObjects(camTargets, true);

  let aimPoint;
  if (camHits.length > 0){
    aimPoint = camHits[0].point.clone();
  } else {
    aimPoint = camOrigin.clone().add(camDir.clone().multiplyScalar(100));
  }

  // Origen del disparo = altura del pecho/hombro del jugador
  const weaponOrigin = new THREE.Vector3(player.position.x, 1.5, player.position.z);
  const aimDir = aimPoint.clone().sub(weaponOrigin).normalize();

  for (let p = 0; p < w.pellets; p++){
    const dir = aimDir.clone();
    dir.x += (Math.random()-0.5) * w.spread * 2;
    dir.y += (Math.random()-0.5) * w.spread * 2;
    dir.z += (Math.random()-0.5) * w.spread * 2;
    dir.normalize();

    raycaster.set(weaponOrigin, dir);
    raycaster.far = w.range;
    const hits = raycaster.intersectObjects(camTargets, true);

    let endPoint = weaponOrigin.clone().add(dir.clone().multiplyScalar(w.range));
    if (hits.length > 0){
      endPoint = hits[0].point.clone();
      let obj = hits[0].object;
      while (obj && !obj.userData.enemyRef) obj = obj.parent;
      if (obj && obj.userData.enemyRef) damageEnemy(obj.userData.enemyRef, w.damage);
    }
    spawnTracer(weaponOrigin, endPoint);
  }

  // Retroceso
  player.recoil = Math.min(player.recoil + 0.08, 0.15);

  // Fogonazo
  spawnMuzzleFlash(weaponOrigin.clone().add(aimDir.clone().multiplyScalar(0.6)));

  if (player.weapon === 'shotgun') SFX.shotgun();
  else if (player.weapon === 'rifle') SFX.rifle();
  else SFX.shoot();

  if (player.ammo[player.weapon] !== Infinity){
    player.ammo[player.weapon]--;
    if (player.ammo[player.weapon] <= 0) player.weapon = 'pistol';
    updatePlayerWeaponMesh();
    updateHUD();
  }

  for (const e of enemies){
    const dx = e.mesh.position.x - player.position.x;
    const dz = e.mesh.position.z - player.position.z;
    if (dx*dx + dz*dz < 30*30){
      e.alert = true; e.lastSeenX = player.position.x; e.lastSeenZ = player.position.z; e.lastSeenTime = 0;
    }
  }
}
function spawnTracer(from, to){
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({ color: 0xffff88, transparent: true, opacity: 0.95 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  setTimeout(() => { scene.remove(line); geo.dispose(); mat.dispose(); }, 80);
}
function spawnMuzzleFlash(pos){
  if (muzzleLight) scene.remove(muzzleLight);
  muzzleLight = new THREE.PointLight(0xffaa33, 3, 5);
  muzzleLight.position.copy(pos);
  scene.add(muzzleLight);
  setTimeout(() => { if (muzzleLight){ scene.remove(muzzleLight); muzzleLight = null; } }, 60);
}
function showHitmarker(){
  const hm = document.getElementById('hitmarker');
  hm.classList.add('show');
  clearTimeout(hm._timer);
  hm._timer = setTimeout(() => hm.classList.remove('show'), 120);
}

// ============ HOSTAGES ============
function tryFreeHostage(){
  for (const h of hostageObjects){
    if (h.freed) continue;
    const dx = h.x - player.position.x, dz = h.z - player.position.z;
    if (dx*dx + dz*dz < 3.5*3.5){
      h.freed = true;
      scene.remove(h.mesh); scene.remove(h.marker);
      score += 75;
      spawnLoot(h.x, h.z, 'health');
      spawnLoot(h.x + 1, h.z, 'weapon:shotgun');
      SFX.hostage();
      showMsg('¡Rehén liberado! +75');
      updateHUD();
      return;
    }
  }
}

// ============ HUD ============
function updateHUD(){
  document.getElementById('hp').textContent = Math.max(0, Math.ceil(player.hp));
  document.getElementById('hpfill').style.width = Math.max(0, player.hp/player.maxHp*100) + '%';
  document.getElementById('score').textContent = score;
  document.getElementById('lvl').textContent = player.lvl;
  document.getElementById('wave').textContent = wave;
  const w = WEAPONS[player.weapon];
  const ammo = player.ammo[player.weapon];
  const ammoTxt = ammo === Infinity ? '∞' : ammo;
  document.getElementById('weapon').textContent = `${w.name} [${ammoTxt}]`;
}
function updateBossBar(){
  const bar = document.getElementById('bossbar');
  if (boss){
    bar.style.display = 'block';
    document.getElementById('bosshp').style.width = Math.max(0, boss.hp/boss.maxHp*100) + '%';
  } else bar.style.display = 'none';
}
let msgTimer;
function showMsg(text){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.opacity = 1;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.style.opacity = 0; }, 1600);
}

// ============ RESET ============
function reset(){
  for (const e of enemies) scene.remove(e.mesh);
  for (const l of loot) scene.remove(l.mesh);
  for (const p of enemyProjectiles) scene.remove(p.mesh);
  enemies = []; loot = []; enemyProjectiles = [];
  boss = null;

  generateWorld();
  if (!grassMesh) createGrassField(8000);

  player.position.set(0, 0, 0);
  player.hp = player.maxHp = 100;
  player.lvl = 1;
  player.weapon = 'pistol';
  player.ammo = { pistol: Infinity, shotgun: 0, rifle: 0 };
  player.recoil = 0;
  yaw = 0; pitch = -0.05;
  if (!playerMesh) buildPlayer();
  playerMesh.position.copy(player.position);
  updatePlayerWeaponMesh();

  score = 0; wave = 1; waveTimer = 0; spawnTimer = 0; bearSpawnTimer = 0;
  gameOver = false;
  for (let i = 0; i < 3; i++) spawnEnemyRandom();
  spawnWavePickups();
  updateHUD(); updateBossBar();
}
function randomFreePos(minDist){
  for (let t = 0; t < 40; t++){
    const ang = Math.random()*Math.PI*2;
    const d = minDist + Math.random()*40;
    const x = Math.cos(ang)*d;
    const z = Math.sin(ang)*d;
    if (Math.abs(x) > BOUND-5 || Math.abs(z) > BOUND-5) continue;
    if (checkCollision(x, z, 1.5)) continue;
    return { x, z };
  }
  return { x: BOUND*0.7, z: BOUND*0.7 };
}
function spawnEnemyRandom(){ const p = randomFreePos(20); spawnEnemy(p.x, p.z); }
function spawnBearRandom(){ const p = randomFreePos(30); spawnBear(p.x, p.z); }
function spawnWavePickups(){
  const p1 = randomFreePos(8);
  spawnLoot(p1.x, p1.z, 'weapon:' + (Math.random()<0.5?'shotgun':'rifle'));
  const p2 = randomFreePos(8);
  spawnLoot(p2.x, p2.z, 'health');
}

// ============ UPDATE ============
function update(dt, t){
  if (grassMaterial && grassMaterial.userData.shader){
    grassMaterial.userData.shader.uniforms.uTime.value = t;
  }
  if (!running || gameOver) return;

  // MOVIMIENTO
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const moveDir = new THREE.Vector3();
  if (keys['w'] || keys['arrowup']) moveDir.add(fwd);
  if (keys['s'] || keys['arrowdown']) moveDir.sub(fwd);
  if (keys['d'] || keys['arrowright']) moveDir.add(right);
  if (keys['a'] || keys['arrowleft']) moveDir.sub(right);

  if (moveDir.lengthSq() > 0){
    moveDir.normalize();
    const dx = moveDir.x * PLAYER_SPEED * dt;
    const dz = moveDir.z * PLAYER_SPEED * dt;
    if (!checkCollision(player.position.x + dx, player.position.z, PLAYER_RADIUS)) player.position.x += dx;
    if (!checkCollision(player.position.x, player.position.z + dz, PLAYER_RADIUS)) player.position.z += dz;
    player.swayPhase += dt * 8;
  }
  playerMesh.position.copy(player.position);
  playerMesh.rotation.y = yaw;

  // Sway de pistola
  const swayX = Math.sin(player.swayPhase) * 0.01;
  playerGunGroup.position.x = 0.28 + swayX;

  // Retroceso
  player.recoil = Math.max(0, player.recoil - dt * 0.8);

  // DISPARO
  lastShotTime += dt;
  if (mouse.down && lastShotTime >= WEAPONS[player.weapon].cooldown && player.ammo[player.weapon] > 0){
    lastShotTime = 0;
    shootOnce();
  }

  // CÁMARA
  const camDir = new THREE.Vector3(
    -Math.sin(yaw) * Math.cos(pitch),
     Math.sin(pitch),
    -Math.cos(yaw) * Math.cos(pitch)
  );
  const shoulder = new THREE.Vector3(-Math.cos(yaw), 0, Math.sin(yaw)).multiplyScalar(0.7);
  const camDist = 4.5;
  const camPos = new THREE.Vector3(
    player.position.x, player.position.y + 1.7 + player.recoil*0.5, player.position.z
  ).add(camDir.clone().multiplyScalar(-camDist)).add(shoulder);
  if (camPos.y < 0.5) camPos.y = 0.5;
  camera.position.lerp(camPos, 1 - Math.pow(0.001, dt));
  camera.lookAt(
    new THREE.Vector3(
      player.position.x, player.position.y + 1.7 + player.recoil*0.5, player.position.z
    ).add(shoulder).add(camDir)
  );

  // SOL
  sun.position.set(player.position.x + 30, 60, player.position.z + 20);
  sun.target.position.set(player.position.x, 0, player.position.z);
  sun.target.updateMatrixWorld();

  // ENEMIGOS
  for (const e of enemies){
    const dx = player.position.x - e.mesh.position.x;
    const dz = player.position.z - e.mesh.position.z;
    const d = Math.hypot(dx, dz);

    if (e.isBear){
      // OSO: detecta a 15m sin cono, persigue y muerde
      if (d < 15){
        e.alert = true;
        e.lastSeenX = player.position.x; e.lastSeenZ = player.position.z; e.lastSeenTime = 0;
        e.mesh.rotation.y = Math.atan2(-dx, -dz);
        if (d > 1.8){
          const nx = e.mesh.position.x + (dx/d) * e.speed * dt;
          const nz = e.mesh.position.z + (dz/d) * e.speed * dt;
          if (!checkCollision(nx, e.mesh.position.z, e.r)) e.mesh.position.x = nx;
          if (!checkCollision(e.mesh.position.x, nz, e.r)) e.mesh.position.z = nz;
        } else {
          // Mordisco
          e.lastBite += dt;
          if (e.lastBite >= e.meleeCd){
            e.lastBite = 0;
            player.hp -= 20;
            SFX.hit();
            showMsg('¡Oso te mordió! -20');
            updateHUD();
            if (player.hp <= 0){ gameOver = true; SFX.gameover(); showGameOver(); return; }
          }
        }
      } else {
        e.alert = false;
        e.wanderTimer -= dt;
        if (e.wanderTimer <= 0){
          e.wanderTimer = 2 + Math.random()*3;
          e.wanderAng = Math.random()*Math.PI*2;
        }
        e.mesh.rotation.y = Math.atan2(-Math.cos(e.wanderAng), -Math.sin(e.wanderAng));
        const nx = e.mesh.position.x + Math.cos(e.wanderAng) * e.speed * 0.4 * dt;
        const nz = e.mesh.position.z + Math.sin(e.wanderAng) * e.speed * 0.4 * dt;
        if (!checkCollision(nx, e.mesh.position.z, e.r)) e.mesh.position.x = nx;
        if (!checkCollision(e.mesh.position.x, nz, e.r)) e.mesh.position.z = nz;
      }
      continue;
    }

    // ENEMIGOS HUMANOS
    const sees = enemySeesPlayer(e);
    if (sees){
      e.alert = true;
      e.lastSeenX = player.position.x; e.lastSeenZ = player.position.z; e.lastSeenTime = 0;
      e.mesh.rotation.y = Math.atan2(-dx, -dz);
    } else {
      e.lastSeenTime += dt;
    }

    if (e.alert && e.lastSeenTime < 6){
      const tdx = e.lastSeenX - e.mesh.position.x;
      const tdz = e.lastSeenZ - e.mesh.position.z;
      const td = Math.hypot(tdx, tdz);
      if (td > (e.isBoss ? 12 : 6)){
        const nx = e.mesh.position.x + (tdx/td) * e.speed * dt;
        const nz = e.mesh.position.z + (tdz/td) * e.speed * dt;
        if (!checkCollision(nx, e.mesh.position.z, e.r)) e.mesh.position.x = nx;
        if (!checkCollision(e.mesh.position.x, nz, e.r)) e.mesh.position.z = nz;
        e.mesh.rotation.y = Math.atan2(-tdx, -tdz);
      } else if (sees){
        const perpAng = Math.atan2(tdz, tdx) + Math.PI/2 * e.strafeDir;
        const nx = e.mesh.position.x + Math.cos(perpAng) * e.speed * 0.6 * dt;
        const nz = e.mesh.position.z + Math.sin(perpAng) * e.speed * 0.6 * dt;
        if (!checkCollision(nx, e.mesh.position.z, e.r)) e.mesh.position.x = nx;
        if (!checkCollision(e.mesh.position.x, nz, e.r)) e.mesh.position.z = nz;
        if (Math.random() < 0.01) e.strafeDir *= -1;
      }
      if (sees){
        e.lastShot += dt;
        if (e.lastShot >= e.shootCd){
          e.lastShot = 0;
          const origin = new THREE.Vector3(e.mesh.position.x, 1.3, e.mesh.position.z);
          const dir = new THREE.Vector3(dx, 0, dz).normalize();
          if (e.isBoss){
            for (let k = -1; k <= 1; k++){
              const ang = Math.atan2(dir.z, dir.x) + k*0.15;
              spawnEnemyProjectile(origin, new THREE.Vector3(Math.cos(ang), 0, Math.sin(ang)), 14);
            }
          } else {
            spawnEnemyProjectile(origin, dir, 10);
          }
          SFX.enemyShoot();
        }
      }
    } else {
      e.alert = false;
      e.wanderTimer -= dt;
      if (e.wanderTimer <= 0){
        e.wanderTimer = 1.5 + Math.random()*2.5;
        e.wanderAng = Math.random()*Math.PI*2;
      }
      e.mesh.rotation.y = Math.atan2(-Math.cos(e.wanderAng), -Math.sin(e.wanderAng));
      const nx = e.mesh.position.x + Math.cos(e.wanderAng) * e.speed * 0.35 * dt;
      const nz = e.mesh.position.z + Math.sin(e.wanderAng) * e.speed * 0.35 * dt;
      if (!checkCollision(nx, e.mesh.position.z, e.r)) e.mesh.position.x = nx;
      if (!checkCollision(e.mesh.position.x, nz, e.r)) e.mesh.position.z = nz;
    }
  }

  // PROYECTILES ENEMIGOS
  for (let i = enemyProjectiles.length-1; i >= 0; i--){
    const p = enemyProjectiles[i];
    p.mesh.position.addScaledVector(p.velocity, dt);
    p.life -= dt;
    const pdx = p.mesh.position.x - player.position.x;
    const pdy = p.mesh.position.y - 1.2;
    const pdz = p.mesh.position.z - player.position.z;
    if (pdx*pdx + pdy*pdy + pdz*pdz < 0.6*0.6){
      player.hp -= p.damage;
      SFX.hit();
      scene.remove(p.mesh);
      enemyProjectiles.splice(i, 1);
      updateHUD();
      if (player.hp <= 0){ gameOver = true; SFX.gameover(); showGameOver(); return; }
      continue;
    }
    if (p.life <= 0 || p.mesh.position.y < 0){
      scene.remove(p.mesh);
      enemyProjectiles.splice(i, 1);
    }
  }

  // LOOT
  for (let i = loot.length-1; i >= 0; i--){
    const l = loot[i];
    l.life -= dt;
    l.mesh.rotation.y += dt * 2;
    l.mesh.position.y = 0.6 + Math.sin(t*3 + l.phase) * 0.15;
    const ldx = l.mesh.position.x - player.position.x;
    const ldz = l.mesh.position.z - player.position.z;
    if (ldx*ldx + ldz*ldz < 1.6*1.6){
      if (l.type === 'coin'){
        score += 5;
        if (score > 0 && score % 100 === 0 && player.lvl < 10){
          player.lvl++; player.maxHp += 15;
          player.hp = Math.min(player.maxHp, player.hp + 20);
          showMsg('¡Subiste de nivel!');
        }
        SFX.pickup();
      } else if (l.type === 'health'){
        player.hp = Math.min(player.maxHp, player.hp + 40);
        SFX.health(); showMsg('+40 Vida');
      } else if (l.type.startsWith('weapon:')){
        const wn = l.type.split(':')[1];
        player.weapon = wn;
        player.ammo[wn] = WEAPONS[wn].maxAmmo;
        updatePlayerWeaponMesh();
        SFX.pickup(); showMsg(WEAPONS[wn].name + ' equipada');
      }
      scene.remove(l.mesh);
      loot.splice(i, 1);
      updateHUD();
      continue;
    }
    if (l.life <= 0){ scene.remove(l.mesh); loot.splice(i, 1); }
  }

  for (const h of hostageObjects){
    if (h.freed) continue;
    h.marker.position.y = 2.6 + Math.sin(t*3)*0.15;
  }

  // OLEADAS
  if (boss) updateBossBar();
  spawnTimer += dt;
  const normalCount = enemies.filter(e => !e.isBoss && !e.isBear).length;
  const maxEnemies = Math.min(6, 3 + Math.floor(wave/2));
  if (spawnTimer > 3 && normalCount < maxEnemies){ spawnTimer = 0; spawnEnemyRandom(); }

  bearSpawnTimer += dt;
  const bearCount = enemies.filter(e => e.isBear).length;
  if (bearSpawnTimer > 20 && bearCount < 2 && wave >= 2){ bearSpawnTimer = 0; spawnBearRandom(); }

  waveTimer += dt;
  if (waveTimer > 40){
    waveTimer = 0; wave++; updateHUD(); spawnWavePickups();
    if (BOSS_WAVES.includes(wave) && !boss){
      const p = randomFreePos(25); spawnBoss(p.x, p.z);
    }
    if (BEAR_WAVES.includes(wave)) spawnBearRandom();
  }
}

// ============ GAME OVER / START ============
function showGameOver(){
  document.exitPointerLock();
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1 style="color:#e74c3c">GAME OVER</h1>
    <p>Puntuación: <b style="color:#ffcc00">${score}</b></p>
    <p>Oleada alcanzada: <b style="color:#ffcc00">${wave}</b></p>
    <button id="restartBtn">REINTENTAR</button>
  `;
  ov.style.display = 'flex';
  document.getElementById('restartBtn').onclick = () => {
    ov.style.display = 'none'; reset(); running = true;
    renderer.domElement.requestPointerLock();
  };
}
document.getElementById('startBtn').onclick = () => {
  document.getElementById('overlay').style.display = 'none';
  reset(); running = true;
  renderer.domElement.requestPointerLock();
};

// ============ LOOP ============
let last = performance.now();
function loop(now){
  const dt = Math.min(DT_CAP, (now - last)/1000);
  last = now;
  const t = now/1000;
  update(dt, t);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
buildPlayer();
reset(); running = false;
requestAnimationFrame(loop);
</script>
