<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inmoinnova · Panel de Consultas</title>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- jsPDF + AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4">
  <div class="max-w-7xl mx-auto">

    <!-- 1. Autenticación del Broker -->
    <div id="auth-box" class="bg-white p-6 rounded-lg shadow-md mb-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">Acceso al Panel de Consultas</h1>
      <p class="text-gray-600 mb-4">Ingrese su clave secreta de broker para continuar.</p>
      <input type="password" id="broker-key" placeholder="Clave de Broker"
             class="border p-2 rounded w-full mb-4" />
      <button onclick="autenticarBroker()"
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">
        Entrar
      </button>
      <p id="auth-status" class="mt-2 text-sm text-red-500"></p>
    </div>

    <!-- 2. Panel de Consultas (oculto hasta autenticarse) -->
    <div id="consulta-panel" class="hidden">
      <h1 class="text-3xl font-bold text-gray-800 mb-6">Inmoinnova · Consulta de Fichas</h1>

      <!-- Filtros -->
      <div class="bg-white p-6 rounded-lg shadow-md mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Filtro de antigüedad -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Antigüedad</label>
          <select id="filtro-antiguedad" class="border p-2 rounded w-full">
            <option value="siempre">Desde siempre</option>
            <option value="recientes" selected>Más recientes</option>
            <option value="especifica">Fecha específica</option>
          </select>
        </div>
        <!-- Fecha específica (oculta por defecto) -->
        <div id="fecha-especifica-container" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
          <input type="date" id="fecha-especifica" class="border p-2 rounded w-full" />
        </div>
        <!-- Botón de filtro -->
        <div class="flex items-end">
          <button onclick="cargarConsultas()"
                  class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 w-full">
            Aplicar Filtros
          </button>
        </div>
      </div>

      <!-- Tabla de resultados -->
      <div class="bg-white rounded-lg shadow-md overflow-x-auto">
        <table id="tabla-resultados" class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Título</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Zona</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Precio (USD)</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Metros²</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fecha</th>
            </tr>
          </thead>
          <tbody id="tbody-resultados" class="bg-white divide-y divide-gray-200">
            <tr><td colspan="5" class="text-center py-4 text-gray-500">Cargue los resultados...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Botón de exportación a PDF -->
      <div class="mt-4 flex justify-end">
        <button onclick="exportarPDF()"
                class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700">
          Exportar a PDF
        </button>
      </div>
    </div>

  </div>

  <script>
    // Configuración
    const SUPABASE_URL = "https://yvaizvkonegqhqkqftcn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QG8X26MRcrGwpWoT7B6odw_VaQpr72j"; // Reemplaza con tu anon key real
    const WORKER_URL = "https://tu-worker.tu-subdominio.workers.dev"; // URL de tu Worker

    let supabaseClient = null;
    let datosActuales = [];

    // 1. Autenticación del Broker (llama al Worker para validar la clave)
    async function autenticarBroker() {
      const key = document.getElementById('broker-key').value.trim();
      if (!key) {
        document.getElementById('auth-status').innerText = 'Ingrese una clave.';
        return;
      }

      try {
        const resp = await fetch(`${WORKER_URL}/auth/broker`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
        const data = await resp.json();

        if (!resp.ok) {
          document.getElementById('auth-status').innerText = data.error || 'Clave incorrecta.';
          return;
        }

        // Crear cliente Supabase con el JWT recibido
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          global: { headers: { Authorization: `Bearer ${data.token}` } }
        });

        // Mostrar panel de consultas
        document.getElementById('auth-box').classList.add('hidden');
        document.getElementById('consulta-panel').classList.remove('hidden');

        // Cargar consultas iniciales
        cargarConsultas();
      } catch (err) {
        document.getElementById('auth-status').innerText = 'Error de conexión: ' + err.message;
      }
    }

    // 2. Cargar consultas según filtros de fecha
    async function cargarConsultas() {
      if (!supabaseClient) return;

      const filtro = document.getElementById('filtro-antiguedad').value;
      const fechaInput = document.getElementById('fecha-especifica').value;

      let query = supabaseClient
        .from('market_listings')
        .select('titulo, zona, precio_usd, metros_2, fecha_captura')
        .order('fecha_captura', { ascending: false });

      if (filtro === 'recientes') {
        // Últimos 30 días
        const hace30Dias = new Date();
        hace30Dias.setDate(hace30Dias.getDate() - 30);
        query = query.gte('fecha_captura', hace30Dias.toISOString());
      } else if (filtro === 'especifica' && fechaInput) {
        // Fecha específica (todo el día)
        const inicio = new Date(fechaInput + 'T00:00:00Z').toISOString();
        const fin = new Date(fechaInput + 'T23:59:59Z').toISOString();
        query = query.gte('fecha_captura', inicio).lte('fecha_captura', fin);
      }
      // "siempre" no añade filtro

      const { data, error } = await query;

      if (error) {
        alert('Error al cargar: ' + error.message);
        return;
      }

      datosActuales = data || [];
      renderizarTabla(datosActuales);
    }

    // 3. Renderizar tabla (responsive)
    function renderizarTabla(datos) {
      const tbody = document.getElementById('tbody-resultados');
      if (datos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-gray-500">No hay resultados.</td></tr>';
        return;
      }

      tbody.innerHTML = datos.map(item => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-2 text-sm text-gray-800">${item.titulo || '—'}</td>
          <td class="px-4 py-2 text-sm text-gray-800">${item.zona || '—'}</td>
          <td class="px-4 py-2 text-sm text-gray-800">$${Number(item.precio_usd).toLocaleString()}</td>
          <td class="px-4 py-2 text-sm text-gray-800">${item.metros_2 || '—'}</td>
          <td class="px-4 py-2 text-sm text-gray-500">${new Date(item.fecha_captura).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    // 4. Exportar a PDF (formato directorio)
    function exportarPDF() {
      if (datosActuales.length === 0) {
        alert('No hay datos para exportar.');
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape' });

      doc.setFontSize(16);
      doc.text('Directorio de Fichas Inmobiliarias', 14, 15);
      doc.setFontSize(10);
      doc.text(`Generado: ${new Date().toLocaleString()}`, 14, 22);

      const head = [['Título', 'Zona', 'Precio (USD)', 'Metros²', 'Fecha']];
      const body = datosActuales.map(item => [
        item.titulo || '—',
        item.zona || '—',
        `$${Number(item.precio_usd).toLocaleString()}`,
        item.metros_2 || '—',
        new Date(item.fecha_captura).toLocaleDateString()
      ]);

      doc.autoTable({
        head: head,
        body: body,
        startY: 28,
        styles: { fontSize: 8, cellPadding: 2 },
        headStyles: { fillColor: [41, 128, 185], textColor: 255 },
        alternateRowStyles: { fillColor: [245, 245, 245] }
      });

      doc.save('directorio_inmobiliario.pdf');
    }

    // Mostrar/ocultar campo de fecha específica
    document.getElementById('filtro-antiguedad').addEventListener('change', function () {
      const container = document.getElementById('fecha-especifica-container');
      if (this.value === 'especifica') {
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
